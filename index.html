<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feria Manager</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

<!-- Menú -->

<aside class="sidebar" id="sidebar">

    <div class="logo">

        <h2>Feria</h2>

        <span>Manager</span>

    </div>

    <nav>

        <ul>

            <li id="menuCalendario">
                <a href="index.html">
                    <span>📅</span>
                    Calendario
                </a>
            </li>

            <li id="menuAgenda">
                <a href="agenda.html">
                    <span>👥</span>
                    Agenda
                </a>
            </li>

            <li id="menuUbicaciones">
                <a href="ubicaciones.html">
                    <span>📍</span>
                    Ubicaciones
                </a>
            </li>

            <li id="menuPagos">
                <a href="pagos.html">
                    <span>💲</span>
                    Pagos
                </a>
            </li>

        </ul>

    </nav>

</aside>

<!-- Contenido -->

<div class="contenido">

<header>

<div class="menu">

☰

</div>

<h1>

Calendario de Ferias

</h1>

</header>

<main>

<section class="tarjeta">

<div class="cabecera-calendario">

<button id="anterior">

◀

</button>

<h2 id="mesActual">

Julio 2026

</h2>

<button id="siguiente">

▶

</button>

</div>

<div class="dias-semana">

<div>Dom</div>

<div>Lun</div>

<div>Mar</div>

<div>Mié</div>

<div>Jue</div>

<div>Vie</div>

<div>Sáb</div>

</div>

<div id="calendario" class="calendario">

</div>

</section>

<section class="detalle">

    <h3>Datos de la Feria</h3>

    <p id="fechaSeleccionada">
    Seleccione un día
    </p>

    <label>Nombre de la Feria</label>

    <input
    type="text"
    id="nombreFeria"
    placeholder="Ej: EUCA">

    <label>Cantidad de Feriantes</label>

    <input
    type="number"
    id="cantidadFeriantes"
    placeholder="0">

    <button id="guardarFeria">

    Guardar Feria

    </button>

    <hr>

    <h3>Feria Programada</h3>

    <div id="detalleDia">

    Seleccione un día.

    </div>

    </section>

</main>

</div>

</div>

<script src="css/js/storage.js"></script>

<script src="css/js/calendario.js"></script>

<script src="css/js/app.js"></script>
<script>

    document.getElementById("menuCalendario").classList.add("activo");

    </script>
</body>

</html>
